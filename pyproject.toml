[project]
name = "say-what"
version = "1.1.0"
description = "Multilingual video content intelligence with grounded RAG chat"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
